version: '3.8'

services:
  bot:
    build: .
    container_name: telegram_bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=sqlite+aiosqlite:///./data/bot.db
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

